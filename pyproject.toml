[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Local, file-based tool for generating tailored resumes and cover letters"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pdfplumber>=0.11",
    "rich>=13.0",
]

[project.scripts]
rb = "resume_builder.cli.commands:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_builder"]

[dependency-groups]
dev = []
